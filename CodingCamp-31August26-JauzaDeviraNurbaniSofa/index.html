<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1>Expense Tracker</h1>
      <div class="balance-card">
        <h2>Total Balance</h2>
        <p id="total-balance">Rp 0</p>
      </div>
    </header>

    <main class="main-content">
      <!-- Visual Chart Section -->
      <section class="card chart-card">
        <h3>Spending Distribution</h3>
        <div class="chart-wrapper">
          <canvas id="expense-chart"></canvas>
        </div>
      </section>

      <!-- Input Form Section -->
      <section class="card form-card">
        <h3>Add New Transaction</h3>
        <form id="transaction-form">
          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input type="text" id="item-name" placeholder="e.g. Nasi Goreng" required />
          </div>

          <div class="form-group">
            <label for="amount">Amount (Rp)</label>
            <input type="number" id="amount" placeholder="e.g. 15000" min="1" required />
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="" disabled selected>Select Category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
          </div>

          <button type="submit" class="btn-submit">Add Transaction</button>
        </form>
      </section>

      <!-- Transaction List Section -->
      <section class="card list-card">
        <h3>Transaction History</h3>
        <div class="list-container">
          <ul id="transaction-list"></ul>
          <p id="empty-state" class="empty-state">No transactions added yet.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
